[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "comfycolab-3d"
version = "0.3.1-dev.0"
description = "ComfyColab mesh generation, refinement, rigging, and part-decomposition pack."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "ComfyColab contributors" },
]
dependencies = []

[project.urls]
Repository = "https://github.com/DragonLord1998/ComfyColab-3D"
Documentation = "https://github.com/DragonLord1998/ComfyColab-3D#readme"
"Bug Tracker" = "https://github.com/DragonLord1998/ComfyColab-3D/issues"

[project.optional-dependencies]
test = [
  "numpy>=1.26",
  "Pillow>=10",
]

[tool.comfy]
PublisherId = "dragonlord1998"
DisplayName = "ComfyColab 3D"
requires-comfyui = ">=0.28.0"

[tool.setuptools]
packages = []
